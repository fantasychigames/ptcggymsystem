<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>寶可夢道館瑞士制管理</title>
<style>
	:root{
		--bg:#0b0f14;
		--card:#111827;
		--muted:#94a3b8;
		--fg:#e5e7eb;
		--accent:#14b8a6;
		--warn:#ef4444;
		--good:#10b981;
		--font-scale:1;
	}

	html,body{height:100%}
	body{
		margin:0;
		background:var(--bg);
		color:var(--fg);
		font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Noto Sans TC,"PingFang TC","Microsoft JhengHei",sans-serif;
		font-size:calc(14px * var(--font-scale));
	}

	.wrap{max-width:1120px;margin:16px auto;padding:0 12px}
	h1{margin:12px 0 6px 0}
	.muted{color:var(--muted)}
	.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
	.col{display:flex;flex-direction:column;gap:8px}
	.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
	@media(max-width:920px){.grid{grid-template-columns:1fr}}

	.card{
		background:var(--card);
		border:1px solid rgba(148,163,184,.2);
		border-radius:14px;
		padding:14px
	}

	.btn{
		background:#1f2937;
		color:#e5e7eb;
		border:1px solid rgba(148,163,184,.25);
		border-radius:10px;
		padding:8px 12px;
		cursor:pointer
	}
	.btn:hover{filter:brightness(1.06)}
	.btn.primary{background:#2563eb}
	.btn.good{background:var(--good)}
	.btn.warn{background:#b45309}
	.btn.ghost{background:transparent}

	.small{font-size:calc(12px * var(--font-scale));}

	.pill{
		padding:2px 8px;
		border-radius:999px;
		background:#1f2937;
		border:1px solid rgba(148,163,184,.3);
		font-size:12px;
	}

	table{width:100%;border-collapse:collapse}
	th,td{
		padding:8px;
		border-bottom:1px solid rgba(148,163,184,.2);
		vertical-align:top
	}

	input[type="text"], input[type="number"], textarea{
		background:#0f172a;
		color:#e5e7eb;
		border:1px solid rgba(148,163,184,.25);
		border-radius:10px;
		padding:8px;
	}
	textarea#bulk{min-height:120px;width:100%}

	.nowrap{white-space:nowrap}
	details>summary{cursor:pointer;user-select:none}

	/* 強化 ID / 姓名顯示 */
	.badge-id{
		display:inline-block;
		font: 700 calc(13px * var(--font-scale))/1 ui-monospace, Menlo, Consolas, monospace;
		letter-spacing:.3px;
		padding:2px 8px;
		border-radius:999px;
		background:#0f172a;
		border:1px solid rgba(148,163,184,.35);
		color:#e2e8f0;
	}
	.name-strong{
		font-size:calc(16px * var(--font-scale));
		font-weight:700;
		letter-spacing:.2px;
	}
	.name-dim{ color:var(--muted) }

	/* 對戰卡片行距 */
	.match-line{
		display:flex;
		align-items:center;
		gap:8px;
		flex-wrap:wrap;
	}
	.btn-win{
		display:flex;
		flex-direction:column;
		align-items:flex-start;
		gap:2px;
		text-align:left;
		min-width:220px;
	}
	.btn-label-main{
		display:flex;
		align-items:center;
		gap:6px;
	}
	.btn-label-sub{
		font-size:12px;
		opacity:.9;
	}
	.btn-win .badge-id{
		font-size:calc(12px * var(--font-scale));
		padding:1px 7px;
	}
	.btn-win .name-strong{
		font-size:calc(14px * var(--font-scale));
	}
</style>
</head>
<body>
	<div class="wrap">
		<h1>寶可夢道館瑞士制管理</h1>
		<div class="muted">支援：批次加入玩家、手動調整配對、雙敗、棄權／復出、快速查桌、座位表投影、CSV 匯出、JSON 存取</div>

		<div class="card">
			<div class="row">
				<input id="eventName" placeholder="賽事名稱（可留空）" style="flex:1;min-width:220px" />
				<span class="pill">玩家：<span id="playerCount">0</span></span>
				<span class="pill">建議輪數：<b id="suggestedRounds">1</b></span>
				<label class="row">設定輪數：<input id="roundsInput" type="number" value="1" min="1" style="width:72px" /></label>
				<button class="btn" id="applyRounds">套用</button>
				<button class="btn primary" id="makePairs">產生下一輪對戰</button>
				<button class="btn warn" id="editPairs">手動調整配對</button>
				<button class="btn" id="shufflePlayers">隨機洗牌（抽籤）</button>
				<label class="row small">字體：
					<select id="fontSize">
						<option value="0.9">小</option>
						<option value="1" selected>中</option>
						<option value="1.15">大</option>
						<option value="1.3">特大</option>
					</select>
				</label>
				<button class="btn good" id="exportCsv">匯出 CSV</button>
				<button class="btn" id="exportSave">存檔</button>
				<button class="btn" id="importSave">讀取存檔</button>
				<input id="importFile" type="file" accept=".json" style="display:none" />
				<button class="btn ghost" id="resetEvent">重置賽事（保留玩家）</button>
			</div>
		</div>

		<div class="grid">
			<div class="col">
				<div class="card">
					<h2>加入玩家</h2>
					<div class="small muted">每行支援：<code>ID 名稱</code>、<code>ID, 名稱</code>、<code>ID，名稱</code>、<code>ID[TAB]名稱</code></div>
					<textarea id="bulk" placeholder="P0001 Pikachu&#10;P0002, Charizard&#10;P0003，Mewtwo&#10;P0004	Snorlax"></textarea>
					<div class="row">
						<button class="btn" id="parse">加入這些玩家</button>
						<button class="btn ghost" id="clearAll">清空玩家</button>
					</div>
				</div>

				<div class="card" id="pairingsCard">
					<h2>對戰配對（當前輪）</h2>
					<div id="roundInfo" class="muted small">尚未產生配對</div>
					<div id="pairings"></div>
				</div>

				<div class="card" id="historyCard">
					<h2>歷史對戰／修改結果</h2>
					<div class="small muted">可展開前面任何一輪，直接變更對局結果（即改即算）。</div>
					<div id="history"></div>
				</div>
			</div>

			<div class="col">
				<div class="card" id="lookupCard">
					<h2>快速查桌</h2>
					<div class="row">
						<input id="tableSearch" placeholder="輸入 Player ID 或 名稱的一部分" style="flex:1;min-width:240px" />
						<button class="btn" id="btnLookup">查詢</button>
						<button class="btn ghost" id="btnSeating">開啟座位表（投影）</button>
					</div>
					<p class="small muted" id="lookupHint">支援部分名稱；若重名會列出所有相符玩家。</p>
					<div id="lookupResult" class="row" style="margin-top:8px"></div>
					<div id="lookupList" style="margin-top:8px"></div>
				</div>

				<div class="card">
					<h2>排名</h2>
					<div id="standings"></div>
				</div>
				
			</div>
		</div>

		<div class="card">
			<h2>玩家名單</h2>
			<table id="playersTable">
				<thead>
					<tr>
						<th>#</th>
						<th>Player ID</th>
						<th>Alphabet Name</th>
						<th>MP</th>
						<th>Opp MP</th>
						<th>Def Pts</th>
						<th>Opp-Opp MP</th>
						<th class="nowrap">操作</th>
					</tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>

<script>
(function(){
	var WIN_POINTS=3, LOSS_POINTS=0, DOUBLE_LOSS_POINTS=0, BYE_POINTS=3;
	var editingPairings=false;
	var state = loadState() || { eventName:'', players:[], round:0, roundsPlanned:1, pairings:[], fontScale:1 };
	var els={};

	function byId(id){ return document.getElementById(id); }
	function refreshEls(){
		els.bulk=byId('bulk'); els.parse=byId('parse'); els.clearAll=byId('clearAll');
		var pt=byId('playersTable'); els.playersTable=pt?pt.querySelector('tbody'):null;
		els.playerCount=byId('playerCount'); els.suggestedRounds=byId('suggestedRounds'); els.roundsInput=byId('roundsInput'); els.applyRounds=byId('applyRounds');
		els.makePairs=byId('makePairs'); els.pairings=byId('pairings'); els.roundInfo=byId('roundInfo'); els.standings=byId('standings');
		els.exportCsv=byId('exportCsv'); els.resetEvent=byId('resetEvent'); els.exportSave=byId('exportSave'); els.importSave=byId('importSave'); els.importFile=byId('importFile');
		els.eventName=byId('eventName'); els.tableSearch=byId('tableSearch'); els.btnLookup=byId('btnLookup'); els.btnSeating=byId('btnSeating'); els.lookupResult=byId('lookupResult'); els.lookupList=byId('lookupList');
		els.editPairs=byId('editPairs'); els.shufflePlayers=byId('shufflePlayers'); els.history=byId('history');els.fontSize = byId('fontSize');
	}
	function saveState(){ localStorage.setItem('poke_swiss', JSON.stringify(state)); }
	function loadState(){ try{ return JSON.parse(localStorage.getItem('poke_swiss')||'null'); }catch(e){ return null; } }
	function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }

	function normalizePlayers(){
		if(!Array.isArray(state.players)) state.players=[];
		for(var i=0;i<state.players.length;i++){
			var p=state.players[i];
			if(!Array.isArray(p.opponents)) p.opponents=[];
			if(!Array.isArray(p.results)) p.results=[];
			if(typeof p.points!=='number') p.points=0;
			if(typeof p.buchholz!=='number') p.buchholz=0;
			if(typeof p.cumulative!=='number') p.cumulative=0;
			if(typeof p.dropped!=='boolean') p.dropped=false;
			if(typeof p.seed!=='number') p.seed=i+1;
			if(!Array.isArray(p.cumulativeHistory)) p.cumulativeHistory=[];
			if(typeof p.defeatedPoints!=='number') p.defeatedPoints = 0;
			if(typeof p.oppOppPoints!=='number') p.oppOppPoints = 0;
		}
	}
	function getPlayer(id){ for(var i=0;i<state.players.length;i++){ if(state.players[i].id===id) return state.players[i]; } return null; }

	function applyFontScale(){
		var s = state.fontScale || 1;
		document.documentElement.style.setProperty('--font-scale', s);
		if(els.fontSize){
			els.fontSize.value = String(s);
		}
	}

	function bindCoreHandlers(){
		refreshEls();
		if(els.parse && !els.parse.__bound){ els.parse.__bound=true; els.parse.addEventListener('click', onBulkAdd); }
		if(els.clearAll && !els.clearAll.__bound){ els.clearAll.__bound=true; els.clearAll.addEventListener('click', function(){
			if(confirm('確定要清空玩家名單？')){
				state.players=[]; state.round=0; state.pairings=[];
				saveState(); renderAll();
			}
		});}
		if(els.applyRounds && !els.applyRounds.__bound){ els.applyRounds.__bound=true; els.applyRounds.addEventListener('click', function(){
			state.roundsPlanned=Math.max(1,parseInt(els.roundsInput.value||'1',10)); saveState(); renderAll();
		});}
		if(els.makePairs && !els.makePairs.__bound){ els.makePairs.__bound=true; els.makePairs.addEventListener('click', onMakePairs); }
		if(els.exportCsv && !els.exportCsv.__bound){ els.exportCsv.__bound=true; els.exportCsv.addEventListener('click', onExportCsv); }
		if(els.resetEvent && !els.resetEvent.__bound){ els.resetEvent.__bound=true; els.resetEvent.addEventListener('click', function(){
			if(confirm('重置整個賽事（保留玩家）？這會清除所有對戰與積分。')) resetEvent();
		});}
		if(els.eventName && !els.eventName.__bound){ els.eventName.__bound=true; els.eventName.addEventListener('input', function(){
			state.eventName=els.eventName.value; saveState();
		});}
		if(els.exportSave && !els.exportSave.__bound){ els.exportSave.__bound=true; els.exportSave.addEventListener('click', onExportSave); }
		if(els.importSave && !els.importSave.__bound){ els.importSave.__bound=true; els.importSave.addEventListener('click', function(){
			if(els.importFile) els.importFile.click();
		});}
		if(els.importFile && !els.importFile.__bound){ els.importFile.__bound=true; els.importFile.addEventListener('change', onImportSave); }
		if(els.btnLookup && !els.btnLookup.__bound){ els.btnLookup.__bound=true; els.btnLookup.addEventListener('click', doLookup); }
		if(els.tableSearch && !els.tableSearch.__bound){ els.tableSearch.__bound=true; els.tableSearch.addEventListener('keydown', function(e){ if(e.key==='Enter') doLookup(); }); }
		if(els.btnSeating && !els.btnSeating.__bound){ els.btnSeating.__bound=true; els.btnSeating.addEventListener('click', openSeatingBoard); }
		if(els.editPairs && !els.editPairs.__bound){ els.editPairs.__bound=true; els.editPairs.addEventListener('click', function(){
			if(!state.round){ alert('尚未有配對可調整'); return; } editingPairings=!editingPairings; renderAll();
		});}
		if(els.shufflePlayers && !els.shufflePlayers.__bound){ els.shufflePlayers.__bound=true; els.shufflePlayers.addEventListener('click', onShuffleSeeds); }
		if(els.fontSize && !els.fontSize.__bound){
			els.fontSize.__bound = true;
			els.fontSize.addEventListener('change', function(){
				var v = parseFloat(this.value) || 1;
				state.fontScale = v;
				saveState();
				applyFontScale();
			});
		}

		// 事件委派（搭配 closest，避免按子元素失效）
		if(!document.__delegated){
			document.__delegated = true;
			document.addEventListener('click', function(e){
				if(!e.target) return;

				// 勝負按鈕
				var btnResult = e.target.closest('[data-result]');
				if(btnResult){
					var r = parseInt(btnResult.getAttribute('data-round'),10);
					var i = parseInt(btnResult.getAttribute('data-table'),10);
					var v = btnResult.getAttribute('data-result');
					recordResult(r,i,v);
					return;
				}

				// 清除結果
				var btnReset = e.target.closest('[data-reset]');
				if(btnReset){
					var r2 = parseInt(btnReset.getAttribute('data-round'),10);
					var i2 = parseInt(btnReset.getAttribute('data-table'),10);
					recordResult(r2,i2,'CLR');
					return;
				}

				// 手動配對儲存 / 取消
				if(e.target.closest('#saveEditedPairs')){
					saveEditedPairings();
					return;
				}
				if(e.target.closest('#cancelEditedPairs')){
					editingPairings=false;
					renderAll();
					return;
				}
			}, false);
		}
	}

	function onBulkAdd(){
		try{
			var raw = els.bulk && typeof els.bulk.value==='string' ? els.bulk.value : '';
			raw = String(raw).replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/\r/g,'');
			var lines = raw.split(/\n/).map(function(s){return s.trim();}).filter(Boolean);
			if(!lines.length){ alert('請先在上方方框貼上玩家資料'); return; }
			var nextSeedBase = state.players.length; var seen={}; state.players.forEach(function(p){seen[p.id]=1;});
			var added=0;
			for(var i=0;i<lines.length;i++){
				var line=lines[i], id='', name='';
				if(line.indexOf('\t')>=0){ var ab=line.split('\t'); id=(ab[0]||'').trim(); name=(ab[1]||'').trim(); }
				else if(line.indexOf(',')>=0){ var ab2=line.split(','); id=(ab2[0]||'').trim(); name=(ab2[1]||'').trim(); }
				else if(line.indexOf('，')>=0){ var ab3=line.split('，'); id=(ab3[0]||'').trim(); name=(ab3[1]||'').trim(); }
				else { var parts=line.split(/\s+/); id=(parts.shift()||'').trim(); name=(parts.join(' ')||'').trim(); }
				if(!id) continue; if(seen[id]) continue; seen[id]=1;

				state.players.push({
					id:id,
					name:name,
					points:0,
					opponents:[],
					results:[],
					seed: nextSeedBase + added + 1,
					buchholz:0,
					cumulative:0,
					cumulativeHistory:[],
					defeatedPoints:0,
					oppOppPoints:0,
					dropped:false
				});
				added++;
			}
			if(els.bulk) els.bulk.value='';
			if(!added){ alert('沒有新增任何玩家（可能是重複的 ID 或格式無效）。'); }
			normalizePlayers(); recomputeFromScratch(); saveState(); renderAll();
		}catch(err){ console.error(err); alert('加入玩家時發生錯誤：'+(err&&err.message?err.message:String(err))); }
	}

	// 排序規則
	function comparePlayers(a,b){
		// 1. 勝場積分
		if(b.points !== a.points) return b.points - a.points;

		// 2. 對手 MP 總和（Buchholz）
		var aOpp = a.buchholz || 0;
		var bOpp = b.buchholz || 0;
		if(bOpp !== aOpp) return bOpp - aOpp;

		// 3. Defeated Players' Point
		var aDef = a.defeatedPoints || 0;
		var bDef = b.defeatedPoints || 0;
		if(bDef !== aDef) return bDef - aDef;

		// 4. 對手的對手 MP 總和
		var aOO = a.oppOppPoints || 0;
		var bOO = b.oppOppPoints || 0;
		if(bOO !== aOO) return bOO - aOO;

		// 5. seed（原始抽籤順序）當最後保底
		return (a.seed || 0) - (b.seed || 0);
	}

	// 瑞士制自動配對
	function swissPairings(players){
		// 只取未棄權玩家並依目前排名排序
		var active = players.filter(function(p){return !p.dropped;});
		var ranked = active.slice().sort(comparePlayers);

		// 決定本輪 BYE
		var byeId = null;
		if(ranked.length % 2 === 1){
			var cand = ranked.slice().sort(function(a,b){return (a.points||0)-(b.points||0);});
			var pick = null;
			for(var i=0;i<cand.length;i++){
				if((cand[i].opponents||[]).indexOf('BYE')===-1){ pick=cand[i]; break; }
			}
			if(!pick) pick=cand[0];
			byeId = pick.id;
		}

		var pool = ranked.filter(function(p){ return p.id !== byeId; });

		function havePlayed(pa, pb){
			return (pa.opponents||[]).indexOf(pb.id)!==-1;
		}
		function scoreDiff(a,b){
			return Math.abs((a.points||0)-(b.points||0));
		}

		var idMap = {}; players.forEach(function(p){ idMap[p.id]=p; });
		var order = pool.slice();
		var used = {};
		var pairs = [];

		function dfs(idx){
			if(idx >= order.length) return true;
			while(idx < order.length && used[order[idx].id]) idx++;
			if(idx >= order.length) return true;

			var a = order[idx];
			used[a.id] = true;

			var cands = [];
			for(var j=0;j<order.length;j++){
				var b = order[j];
				if(a.id===b.id || used[b.id]) continue;
				if(!havePlayed(idMap[a.id], idMap[b.id])){
					cands.push(b);
				}
			}
			cands.sort(function(x,y){
				return scoreDiff(a,x) - scoreDiff(a,y);
			});

			function tryWithCandidates(list){
				for(var k=0;k<list.length;k++){
					var b = list[k];
					used[b.id] = true;
					pairs.push({a:a.id, b:b.id});
					if(dfs(idx+1)) return true;
					pairs.pop();
					used[b.id] = false;
				}
				return false;
			}

			if(tryWithCandidates(cands)){
				return true;
			}

			used[a.id] = false;
			return false;
		}

		dfs(0);
		if(pairs.length*2 !== pool.length){
			alert('本輪自動配對找不到「零重配」的完整解，請改用「手動調整配對」。');
			return [];
		}

		var matches = [];
		for(var i3=0;i3<pairs.length;i3++){
			var m = pairs[i3];
			matches.push({a:m.a,b:m.b,table:matches.length+1,result:null});
		}

		if(byeId){
			matches.push({a:byeId,b:'BYE',table:matches.length+1,result:'BYE'});
		}
		return matches;
	}

	function onMakePairs(){
		if(state.round>0){
			var prev=state.pairings[state.round-1]||[];
			for(var i=0;i<prev.length;i++){
				if(!prev[i].result){
					alert('上一輪尚有未填結果的對局');
					return;
				}
			}
		}
		if(state.round>=state.roundsPlanned){
			if(!confirm('已達設定輪數，仍要再產生一輪嗎？')) return;
		}
		var roundNum=state.round+1;
		var pairs=swissPairings(state.players);

		if(!pairs || !pairs.length){
			return;
		}

		state.pairings[state.round]=pairs;
		state.round=roundNum;
		saveState();
		renderAll();
	}

	function recordResult(roundIndex, tableIndex, result){
		var m=(state.pairings[roundIndex]||[])[tableIndex]; if(!m) return;
		if(m.result==='BYE') return;
		m.result=(result==='CLR')?null:result;
		recomputeFromScratch(); saveState(); renderAll();
	}

	function recomputeFromScratch(){
		var idMap={};
		state.players.forEach(function(p){
			p.points = 0;
			p.opponents = [];
			p.results = [];
			p.buchholz = 0;
			p.cumulative = 0;
			p.cumulativeHistory = [];
			p.defeatedPoints = 0;
			p.oppOppPoints = 0;
			idMap[p.id] = p;
		});

		for(var r=0;r<state.round;r++){
			var list=state.pairings[r]||[];
			for(var i=0;i<list.length;i++){
				var m=list[i], pa=idMap[m.a], pb=idMap[m.b];
				if(m.result==='BYE'&&pa){
					pa.points+=BYE_POINTS; pa.opponents.push('BYE'); pa.results.push('WIN');
				} else if(m.result==='A'&&pa&&pb){
					pa.points+=WIN_POINTS; pb.points+=LOSS_POINTS; pa.results.push('WIN'); pb.results.push('LOSS'); pa.opponents.push(pb.id); pb.opponents.push(pa.id);
				} else if(m.result==='B'&&pa&&pb){
					pb.points+=WIN_POINTS; pa.points+=LOSS_POINTS; pb.results.push('WIN'); pa.results.push('LOSS'); pa.opponents.push(pb.id); pb.opponents.push(pa.id);
				} else if(m.result==='DD'&&pa&&pb){
					pa.points+=DOUBLE_LOSS_POINTS; pb.points+=DOUBLE_LOSS_POINTS; pa.results.push('DLOSS'); pb.results.push('DLOSS'); pa.opponents.push(pb.id); pb.opponents.push(pa.id);
				}
			}
			state.players.forEach(function(p){
				p.cumulativeHistory.push(p.points);
			});
		}

		state.players.forEach(function(p){
			p.cumulative = (p.cumulativeHistory || []).reduce(function(acc, val){ return acc + val; }, 0);
		});
		recomputeTiebreakers();
	}

	function recomputeTiebreakers(){
		var idMap = {};
		state.players.forEach(function(p){ idMap[p.id] = p; });

		state.players.forEach(function(p){
			p.buchholz = 0;
			p.defeatedPoints = 0;
			p.oppOppPoints = 0;
			p._oppSet = {};
		});

		// Buchholz + 對手集合
		state.players.forEach(function(p){
			var opps = p.opponents || [];
			var oppSet = p._oppSet;
			for(var i=0;i<opps.length;i++){
				var oid = opps[i];
				if(oid === 'BYE') continue;
				var opp = idMap[oid];
				if(!opp) continue;
				p.buchholz += (opp.points || 0);
				oppSet[oid] = true;
			}
		});

// Defeated Players’ Points（同 MP 中，每打贏一個 +3）
state.players.forEach(function(p){ p.defeatedPoints = 0; });

for (var r = 0; r < state.round; r++) {
    var list = state.pairings[r] || [];
    for (var i = 0; i < list.length; i++) {
        var m = list[i];
        if (!m || m.result === 'BYE' || m.result === 'DD') continue;

        var pa = idMap[m.a];
        var pb = idMap[m.b];
        if (!pa || !pb) continue;

        // 只有同 MP 的玩家才計算 Defeated Players' Point
        if (pa.points === pb.points) {

            if (m.result === 'A') {
                // A 打贏 B，且雙方 MP 一樣 → A 拿 3 分
                pa.defeatedPoints += 3;
            }

            if (m.result === 'B') {
                // B 打贏 A，且雙方 MP 一樣 → B 拿 3 分
                pb.defeatedPoints += 3;
            }
        }
    }
}


		// Opponents' Opponents' Points
		state.players.forEach(function(p){
			var sum2 = 0;
			var oppSet = p._oppSet || {};

			for(var oid in oppSet){
				if(!oppSet.hasOwnProperty(oid)) continue;
				var opp = idMap[oid];
				if(!opp) continue;

				var innerOpps = opp.opponents || [];
				var innerSet = {};

				for(var j=0;j<innerOpps.length;j++){
					var oid2 = innerOpps[j];
					if(oid2 === 'BYE' || oid2 === p.id) continue;
					innerSet[oid2] = true;
				}

				for(var oid2 in innerSet){
					if(!innerSet.hasOwnProperty(oid2)) continue;
					var p2 = idMap[oid2];
					if(p2) sum2 += (p2.points || 0);
				}
			}

			p.oppOppPoints = sum2;
			delete p._oppSet;
		});
	}

	function onImportSave(evt){
		var file=evt.target && evt.target.files && evt.target.files[0]; if(!file) return;
		var reader=new FileReader();
		reader.onload=function(){
			try{
				var obj=JSON.parse(String(reader.result||'{}'));
				var newState=obj.state||obj;
				if(!newState||!Array.isArray(newState.players)) throw new Error('檔案內容不完整或格式錯誤');
				if(!confirm('載入存檔會覆蓋目前的比賽進度，確定要覆蓋嗎？')){ evt.target.value=''; return; }
				state.eventName=newState.eventName||'';
				state.players=Array.isArray(newState.players)?newState.players:[];
				state.round=Number(newState.round||0);
				state.roundsPlanned=Number(newState.roundsPlanned||1);
				state.pairings=Array.isArray(newState.pairings)?newState.pairings:[];
				state.fontScale = Number(newState.fontScale || 1);
				normalizePlayers(); recomputeFromScratch(); saveState(); renderAll();
				alert('已成功載入存檔');
			}catch(e){ alert('讀取存檔失敗：'+(e&&e.message?e.message:String(e))); }
			finally{ evt.target.value=''; }
		};
		reader.readAsText(file,'utf-8');
	}

	function findCurrentTableOf(id){
		if(state.round<=0) return null;
		var list=state.pairings[state.round-1]||[];
		for(var i=0;i<list.length;i++){
			var m=list[i];
			if(m.result==='BYE' && m.a===id){ return { round: state.round, table: i+1, opponent: null, bye: true }; }
			if(m.a===id || m.b===id){
				var oppId=(m.a===id)? m.b : m.a; return { round: state.round, table: i+1, opponent: getPlayer(oppId) || null };
			}
		}
		return null;
	}

		var partialName=state.players.filter(function(x){ return String(x.name||'').toLowerCase().indexOf(qq)>=0; });
		var partialId=state.players.filter(function(x){ return String(x.id||'').toLowerCase().indexOf(qq)>=0; });
		var out=[]; var seen={};
		function pushAll(arr){ for(var i=0;i<arr.length;i++){ var p=arr[i]; if(!seen[p.id]){ seen[p.id]=1; out.push(p); } } }
		pushAll(exact); pushAll(partialName); pushAll(partialId);
		if(!out.length){ if(box) box.innerHTML='<span class="muted">找不到符合的玩家</span>'; if(listBox) listBox.innerHTML=''; return; }
		if(box) box.innerHTML='<span class="muted small">找到 '+out.length+' 筆：</span>';
		var rows='';
		for(var i2=0;i2<out.length;i2++){
			var p=out[i2]; var info=findCurrentTableOf(p.id); var opp=''; var desk='尚未配對'; var link='';
			if(info){ desk='第 '+info.round+' 輪／第 <b>'+info.table+'</b> 桌'; opp = info.opponent? (esc(info.opponent.id)+' '+esc(info.opponent.name||'')) : 'BYE'; link='<a class="btn ghost small" href="#table-'+info.round+'-'+info.table+'">捲到</a>'; }
			rows += '<tr><td>'+esc(p.id)+'</td><td>'+esc(p.name||'')+'</td><td>'+desk+'</td><td>'+opp+'</td><td>'+link+'</td></tr>';
		}
		if(listBox) listBox.innerHTML='<table><thead><tr><th>Player ID</th><th>名稱</th><th>桌次</th><th>對手</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
	}

	// 座位表視窗
	function openSeatingBoard(){
		var w = window.open('', '_blank');
		if(!w){ alert('無法開啟新視窗，請允許彈出視窗。'); return; }

		var html = '<!doctype html>\
<html lang="zh-Hant">\
<head>\
	<meta charset="utf-8">\
	<meta name="viewport" content="width=device-width, initial-scale=1">\
	<title>座位表</title>\
	<style>\
		:root{\
			--bg:#0b0f14;\
			--card:#111827;\
			--muted:#94a3b8;\
			--fg:#e5e7eb;\
			--accent:#14b8a6;\
			--warn:#ef4444;\
			--good:#10b981;\
			--font-scale:'+state.fontScale+';\
		}\
		html,body{height:100%}\
		body{\
			margin:0;\
			background:var(--bg);\
			color:var(--fg);\
			font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Noto Sans TC,\"PingFang TC\",\"Microsoft JhengHei\",sans-serif;\
			font-size:calc(20px * var(--font-scale));\
		}\
		.wrap{max-width:1400px;margin:16px auto;padding:0 16px}\
		h1{margin:0 0 8px 0;font-size:clamp(22px,3vw,calc(34px * var(--font-scale)))}\
		.muted{color:var(--muted)}\
		.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}\
		.card{background:#111827;border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:14px}\
		.tableNo{font-size:calc(22px * var(--font-scale));\
			font-weight:700;margin-bottom:6px}\
		.big{font-size:calc(18px * var(--font-scale));\
		}\
		.footer{margin-top:12px;font-size:calc(12px * var(--font-scale))}\
		.badge-id{\
			display:inline-block;\
			font: 700 calc(16px * var(--font-scale))/1 ui-monospace, Menlo, Consolas, monospace;\
			letter-spacing:.3px;\
			padding:2px 10px;\
			border-radius:999px;\
			background:#0f172a;\
			border:1px solid rgba(148,163,184,.35);\
			color:#e2e8f0;\
		}\
		.name-strong{\
			font-size:calc(20px * var(--font-scale));\
			font-weight:700;\
			letter-spacing:.2px;\
		}\
	</style>\
</head>\
<body>\
	<div class=\"wrap\">\
		<h1>座位表<span id=\"title\"></span></h1>\
		<div class=\"muted\" id=\"subtitle\"></div>\
		<div id=\"board\"></div>\
		<div class=\"footer muted\">每 15 秒自動刷新；請按 F11 進入全螢幕。</div>\
	</div>\
</body>\
</html>';

		w.document.open();
		w.document.write(html);
		w.document.close();

		function escSeat(s){
			return String(s||'').replace(/[&<>"']/g,function(c){
				return {
					"&":"&amp;",
					"<":"&lt;",
					">":"&gt;",	
					"\"":"&quot;",
					"'":"&#39;"
				}[c] || c;
			});
		}

		function renderSeatingInto(childWin){
			if(!childWin || childWin.closed) return;
			var doc = childWin.document;
			var titleEl = doc.getElementById('title');
			var subEl = doc.getElementById('subtitle');
			var board = doc.getElementById('board');
			if(!titleEl || !subEl || !board) return;

			var st = {};
			try{ st = JSON.parse(localStorage.getItem('poke_swiss')||'null') || {}; }catch(_e){ st={}; }

			var title = st.eventName ? ('｜'+st.eventName) : '';
			var subtitle = st.round ? ('第 '+st.round+' 輪 · 玩家 '+((st.players&&st.players.length)||0)+' 人') : '尚未配對';
			titleEl.textContent = title;
			subEl.textContent = subtitle+' ｜ 更新：'+new Date().toLocaleTimeString();

			if(!st.round){
				board.innerHTML = '<p class="muted">尚未產生配對</p>';
				return;
			}

			var list = (st.pairings && st.pairings[st.round-1]) || [];
			var players = {};
			(st.players||[]).forEach(function(p){ players[p.id]=p; });

			var out = '';
			for(var i=0;i<list.length;i++){
				var m = list[i];
				if(m && m.result==='BYE'){
					var pa0 = players[m.a] || {};
					out += '<div class="card">'+
						  '<div class="tableNo">桌 '+(i+1)+'</div>'+
						  '<div class="big"><span class="badge-id">'+escSeat(pa0.id)+'</span> '+
						  '<span class="name-strong">'+escSeat(pa0.name)+'</span>（BYE +'+BYE_POINTS+'）</div>'+
						'</div>';
				}else{
					var pa = players[m.a]||{}, pb = players[m.b]||{};
					out += '<div class="card">'+
						  '<div class="tableNo">桌 '+(i+1)+'</div>'+
						  '<div class="big"><span class="badge-id">'+escSeat(pa.id)+'</span> <span class="name-strong">'+escSeat(pa.name)+'</span></div>'+
						  '<div class="muted">vs</div>'+
						  '<div class="big"><span class="badge-id">'+escSeat(pb.id)+'</span> <span class="name-strong">'+escSeat(pb.name)+'</span></div>'+
						'</div>';
				}
			}
			board.innerHTML = '<div class=\"grid\">'+out+'</div>';
		}

		// 首次渲染 + 每 15 秒刷新
		renderSeatingInto(w);
		if(w.__seatTimer){ try{ clearInterval(w.__seatTimer); }catch(_e){} }
		w.__seatTimer = setInterval(function(){
			if(!w || w.closed){ try{ clearInterval(w.__seatTimer); }catch(_e){} return; }
			renderSeatingInto(w);
		}, 15000);

		// localStorage 變更時即時刷新
		function _storageHandler(){ if(!w || w.closed) return; renderSeatingInto(w); }
		window.addEventListener('storage', _storageHandler);
		var unload = function(){
			try{
				window.removeEventListener('storage', _storageHandler);
				if(w && w.__seatTimer) clearInterval(w.__seatTimer);
			}catch(_e){}
		};
		w.addEventListener('beforeunload', unload);
		window.addEventListener('beforeunload', unload);
	}

	function saveEditedPairings(){
		var inputs = Array.prototype.slice.call(document.querySelectorAll('.pair-edit-input'));
		var rawTables = {};
		inputs.forEach(function(inp){
			var t = parseInt(inp.getAttribute('data-table'),10);
			var side = inp.getAttribute('data-side');
			var val = (inp.value || '').trim();
			rawTables[t] = rawTables[t] || {A:'', B:''};
			rawTables[t][side] = val;
		});

		var activeMap = {};
		(state.players||[]).forEach(function(p){ if(!p.dropped) activeMap[p.id]=p; });
		var validIds = Object.keys(activeMap);

		function isValidId(x){
			var xl=String(x).toLowerCase();
			for(var i=0;i<validIds.length;i++){ if(validIds[i].toLowerCase()===xl) return true; }
			return false;
		}
		function toCanonicalId(x){
		var xl=String(x).toLowerCase();
			for(var i=0;i<validIds.length;i++){ if(validIds[i].toLowerCase()===xl) return validIds[i]; }
			return x;
		}

		var used = {};
		var tables = {};
		var byeCount = 0;
		var activeCount = validIds.length;
		var BYE_WORD = 'bye';

		for(var key in rawTables){
			if(!rawTables.hasOwnProperty(key)) continue;
			var idx = parseInt(key,10);
			var v = rawTables[key];

			var A = (v.A || '').trim();
			var B = (v.B || '').trim();
			var aIsBye = A && A.toLowerCase() === BYE_WORD;
			var bIsBye = B && B.toLowerCase() === BYE_WORD;

			if(!A && !B){
				alert('第 '+(idx+1)+' 桌沒有輸入任何玩家 ID，請檢查。');
				return;
			}
			if(aIsBye && bIsBye){
				alert('第 '+(idx+1)+' 桌不能同時兩個 BYE。');
				return;
			}

			if(aIsBye || bIsBye){
				byeCount++;
				var pid = aIsBye ? B : A;
				if(!pid){
					alert('第 '+(idx+1)+' 桌為 BYE 對局時，必須有一位實際玩家 ID。');
					return;
				}
				if(!isValidId(pid)){
					alert('偵測到不存在或已棄權的玩家 ID：'+pid);
					return;
				}
				pid = toCanonicalId(pid);
				if(used[pid]){
					alert('玩家 '+pid+' 在多個桌次中出現，請檢查。');
					return;
				}
				used[pid] = 1;
				tables[idx] = { type:'BYE', player: pid };
			} else {
				if(!A || !B){
					alert('第 '+(idx+1)+' 桌需輸入兩位玩家 ID（或其一為 BYE）。');
					return;
				}
				if(!isValidId(A) || !isValidId(B)){
					alert('偵測到不存在或已棄權的玩家 ID：'+A+' / '+B);
					return;
				}
				A = toCanonicalId(A);
				B = toCanonicalId(B);
				if(A === B){
					alert('第 '+(idx+1)+' 桌的兩個欄位為同一位玩家，請修正。');
					return;
				}
				if(used[A] || used[B]){
					alert('玩家 '+A+' 或 '+B+' 在多個桌次中出現，請檢查。');
					return;
				}
				used[A] = 1; used[B] = 1;
				tables[idx] = { type:'MATCH', A:A, B:B };
			}
		}

		if(activeCount % 2 === 1){
			if(byeCount !== 1){
				alert('目前未棄權玩家為奇數，必須且只能指定一桌 BYE（在任一欄輸入 BYE）。');
				return;
			}
		} else {
			if(byeCount !== 0){
				alert('目前未棄權玩家為偶數，不應存在 BYE 桌，請移除 BYE 設定。');
				return;
			}
		}

		var roundIdx = state.round - 1;
		var keys = Object.keys(tables).map(function(x){return parseInt(x,10);}).sort(function(a,b){return a-b;});
		var newList = [];

		for(var i3=0;i3<keys.length;i3++){
			var tIndex = keys[i3];
			var v2 = tables[tIndex];
			if(v2.type === 'BYE'){
				newList.push({ a:v2.player, b:'BYE', table:newList.length+1, result:'BYE' });
			} else if(v2.type === 'MATCH'){
				newList.push({ a:v2.A, b:v2.B, table:newList.length+1, result:null });
			}
		}

		state.pairings[roundIdx] = newList;
		editingPairings=false;
		saveState();
		recomputeFromScratch();
		renderAll();
	}

	function onShuffleSeeds(){
		if(!state.players||state.players.length<2){ alert('玩家不足，無需洗牌'); return; }
		if(state.round>0){ if(!confirm('比賽已開始。此動作只會重新隨機分配每位玩家的 seed（同分排序用），不會改變已完成的配對與積分。要繼續嗎？')) return; }
		var ids=state.players.map(function(p){return p.id;});
		for(var i4=ids.length-1;i4>0;i4--){
			var j;
			if(window.crypto&&crypto.getRandomValues){ var buf=new Uint32Array(1); crypto.getRandomValues(buf); j=buf[0]%(i4+1);}
			else { j=Math.floor(Math.random()*(i4+1)); }
			var tmp=ids[i4]; ids[i4]=ids[j]; ids[j]=tmp;
		}
		var rankMap={}; for(var k=0;k<ids.length;k++){ rankMap[ids[k]]=k+1; }
		for(var t3=0;t3<state.players.length;t3++){ state.players[t3].seed=rankMap[state.players[t3].id]; }
		saveState(); renderAll(); alert('已完成隨機洗牌');
	}

	document.addEventListener('DOMContentLoaded', function(){
		normalizePlayers();
		bindCoreHandlers();
		applyFontScale();
		recomputeFromScratch();
		renderAll();
	});
})();
</script>
